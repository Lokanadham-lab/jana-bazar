<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>JANA BAZAR | Local Multi-Vendor Marketplace</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7f8;color:#17202a;
line-height:1.5
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.header{
position:sticky;top:0;z-index:100;
background:#fff;border-bottom:1px solid #ddd;
padding:12px 16px
}
.header-inner{
max-width:1200px;margin:auto;
display:flex;align-items:center;gap:12px;
flex-wrap:wrap
}
.logo{
font-size:24px;font-weight:900;color:#0f766e;
white-space:nowrap
}
.logo small{display:block;font-size:10px;color:#777}
.search{
flex:1;min-width:180px;
padding:11px 14px;border:1px solid #ddd;
border-radius:10px;outline:none
}
.search:focus{border-color:#0f766e}
.nav{display:flex;gap:7px;flex-wrap:wrap}
.btn{
padding:10px 14px;border-radius:9px;
background:#0f766e;color:#fff;font-weight:700
}
.btn.secondary{background:#e8f5f3;color:#0f766e}
.btn.dark{background:#263238}
.btn.red{background:#dc2626}
.btn.orange{background:#ea580c}
.btn.gray{background:#64748b}
.btn.small{padding:7px 10px;font-size:13px}
.container{max-width:1200px;margin:auto;padding:18px}
.hero{
background:linear-gradient(135deg,#0f766e,#14b8a6);
color:white;border-radius:18px;padding:30px 24px;
margin-bottom:18px
}
.hero h1{font-size:32px;margin-bottom:6px}
.hero p{opacity:.95;margin-bottom:15px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.categories{
display:flex;gap:8px;overflow:auto;padding:5px 0 15px
}
.cat{
background:#fff;border:1px solid #ddd;
padding:9px 15px;border-radius:20px;
white-space:nowrap
}
.cat.active,.cat:hover{
background:#0f766e;color:#fff;border-color:#0f766e
}
.section-title{
display:flex;justify-content:space-between;
align-items:center;margin:15px 0
}
.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
gap:15px
}
.card{
background:#fff;border-radius:14px;
border:1px solid #e2e8f0;
overflow:hidden;box-shadow:0 2px 8px #00000008
}
.product-img{
height:150px;background:#ecfdf5;
display:flex;align-items:center;justify-content:center;
font-size:60px
}
.product-body{padding:13px}
.product-name{font-weight:800;font-size:16px}
.seller{font-size:12px;color:#64748b;margin:3px 0}
.price{font-size:20px;font-weight:900;color:#0f766e}
.mrp{font-size:12px;color:#888;text-decoration:line-through}
.stock{font-size:12px;color:#16a34a;margin:3px 0}
.card-actions{display:flex;gap:7px;margin-top:9px}
.card-actions button{flex:1}
.empty{
padding:35px;text-align:center;color:#64748b;
background:#fff;border-radius:14px
}
.footer{
margin-top:40px;background:#17202a;color:#fff;
padding:30px 18px;text-align:center
}

/* modal */
.overlay{
display:none;position:fixed;inset:0;
background:#0008;z-index:500;
align-items:center;justify-content:center;
padding:15px
}
.overlay.show{display:flex}
.modal{
background:#fff;width:min(650px,100%);
max-height:92vh;overflow:auto;
border-radius:16px;padding:20px
}
.modal-head{
display:flex;justify-content:space-between;
align-items:center;margin-bottom:15px
}
.close{
background:#eee;border-radius:50%;
width:34px;height:34px;font-weight:bold
}
.form-grid{
display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.field{margin-bottom:10px}
.field.full{grid-column:1/-1}
.field label{
display:block;font-size:13px;font-weight:700;
margin-bottom:4px
}
.field input,.field select,.field textarea{
width:100%;padding:10px;
border:1px solid #d1d5db;border-radius:8px;
outline:none
}
.field textarea{min-height:80px;resize:vertical}
.form-actions{
display:flex;gap:8px;margin-top:12px;flex-wrap:wrap
}
.tabs{
display:flex;gap:7px;overflow:auto;margin-bottom:15px
}
.tab{
padding:9px 13px;border-radius:8px;
background:#e2e8f0;white-space:nowrap
}
.tab.active{background:#0f766e;color:#fff}
.panel{
background:#fff;border-radius:14px;
padding:18px;margin-bottom:15px;
border:1px solid #e2e8f0
}
.stat-grid{
display:grid;grid-template-columns:repeat(4,1fr);
gap:10px;margin-bottom:15px
}
.stat{
background:#f0fdfa;border-radius:12px;padding:15px
}
.stat b{display:block;font-size:24px;color:#0f766e}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{
padding:10px;border-bottom:1px solid #e5e7eb;
text-align:left;font-size:13px
}
th{background:#f8fafc}
.badge{
display:inline-block;padding:4px 8px;
border-radius:20px;font-size:11px;font-weight:bold
}
.badge.pending{background:#fff7ed;color:#c2410c}
.badge.approved{background:#dcfce7;color:#15803d}
.badge.rejected{background:#fee2e2;color:#b91c1c}
.cart-row{
display:flex;gap:10px;align-items:center;
padding:10px 0;border-bottom:1px solid #eee
}
.cart-icon{
width:55px;height:55px;background:#ecfdf5;
display:flex;align-items:center;justify-content:center;
font-size:28px;border-radius:9px
}
.cart-info{flex:1}
.qty{
display:flex;align-items:center;gap:8px
}
.qty button{
width:28px;height:28px;border-radius:6px;
background:#e2e8f0
}
.total-box{
background:#f0fdfa;padding:15px;
border-radius:10px;margin-top:15px
}
.notice{
padding:10px;background:#fffbeb;
border:1px solid #fde68a;border-radius:8px;
font-size:13px;margin-bottom:12px
}
@media(max-width:650px){
.header-inner{align-items:stretch}
.logo{width:100%}
.search{order:3;width:100%}
.nav{width:100%}
.nav .btn{flex:1}
.hero h1{font-size:25px}
.form-grid{grid-template-columns:1fr}
.field.full{grid-column:auto}
.stat-grid{grid-template-columns:1fr 1fr}
.products{grid-template-columns:repeat(2,1fr);gap:9px}
.product-img{height:115px;font-size:45px}
.product-body{padding:9px}
.product-name{font-size:14px}
.price{font-size:17px}
}
</style>
</head>

<body>

<header class="header">
<div class="header-inner">
<div class="logo">
JANA BAZAR
<small>LOCAL • TRUSTED • MULTI-VENDOR</small>
</div>

<input id="searchInput" class="search"
placeholder="Search products, categories or shops...">

<nav class="nav">
<button class="btn secondary" onclick="openCart()">🛒 Cart <span id="cartCount">0</span></button>
<button class="btn secondary" onclick="openCustomer()">👤 Account</button>
<button class="btn" onclick="openSeller()">🏪 Seller</button>
<button class="btn dark" onclick="openAdmin()">👑 Admin</button>
</nav>
</div>
</header>

<main class="container">

<section class="hero">
<h1>JANA BAZAR</h1>
<p>Your Local Multi-Vendor Marketplace</p>
<div class="hero-actions">
<button class="btn" onclick="scrollProducts()">🛍️ Shop Now</button>
<button class="btn secondary" onclick="openSeller()">🏪 Sell on JANA BAZAR</button>
</div>
</section>

<div class="categories" id="categories"></div>

<section id="productSection">
<div class="section-title">
<h2>🛍️ Products</h2>
<span id="productCount"></span>
</div>
<div id="products" class="products"></div>
</section>

</main>

<footer class="footer">
<h2>JANA BAZAR</h2>
<p>Local Multi-Vendor E-Commerce Platform</p>
<p style="margin-top:8px;font-size:12px">Customer • Seller • Admin • Local Delivery</p>
</footer>


<!-- CUSTOMER MODAL -->
<div class="overlay" id="customerModal">
<div class="modal">
<div class="modal-head">
<h2>👤 Customer Account</h2>
<button class="close" onclick="closeModal('customerModal')">×</button>
</div>

<div id="customerContent"></div>
</div>
</div>


<!-- SELLER MODAL -->
<div class="overlay" id="sellerModal">
<div class="modal">
<div class="modal-head">
<h2>🏪 Seller Panel</h2>
<button class="close" onclick="closeModal('sellerModal')">×</button>
</div>

<div id="sellerContent"></div>
</div>
</div>


<!-- ADMIN MODAL -->
<div class="overlay" id="adminModal">
<div class="modal">
<div class="modal-head">
<h2>👑 Admin Panel</h2>
<button class="close" onclick="closeModal('adminModal')">×</button>
</div>

<div id="adminContent"></div>
</div>
</div>


<!-- CART MODAL -->
<div class="overlay" id="cartModal">
<div class="modal">
<div class="modal-head">
<h2>🛒 Shopping Cart</h2>
<button class="close" onclick="closeModal('cartModal')">×</button>
</div>
<div id="cartContent"></div>
</div>
</div>


<!-- PRODUCT MODAL -->
<div class="overlay" id="productModal">
<div class="modal">
<div class="modal-head">
<h2 id="productModalTitle">Add Product</h2>
<button class="close" onclick="closeModal('productModal')">×</button>
</div>
<div id="productForm"></div>
</div>
</div>


<script>
/* =========================
   JANA BAZAR FINAL V5
   ========================= */

const KEYS={
products:"JANA_BAZAR_FINAL_PRODUCTS",
cart:"JANA_BAZAR_FINAL_CART",
users:"JANA_BAZAR_FINAL_USERS",
sellers:"JANA_BAZAR_FINAL_SELLERS",
orders:"JANA_BAZAR_FINAL_ORDERS",
user:"JANA_BAZAR_FINAL_CURRENT_USER",
seller:"JANA_BAZAR_FINAL_CURRENT_SELLER"
};

const seedProducts=[
{id:"p1",name:"Premium Rice",category:"Groceries",price:599,mrp:650,stock:50,icon:"🍚",seller:"JANA BAZAR",status:"approved",type:"direct"},
{id:"p2",name:"Fresh Milk",category:"Groceries",price:60,mrp:65,stock:30,icon:"🥛",seller:"JANA BAZAR",status:"approved",type:"direct"},
{id:"p3",name:"Fresh Apples",category:"Fruits",price:180,mrp:210,stock:40,icon:"🍎",seller:"JANA BAZAR",status:"approved",type:"direct"},
{id:"p4",name:"Body Care",category:"Personal Care",price:199,mrp:240,stock:25,icon:"🧴",seller:"JANA BAZAR",status:"approved",type:"direct"},
{id:"p5",name:"Fresh Tomatoes",category:"Vegetables",price:55,mrp:70,stock:45,icon:"🍅",seller:"JANA BAZAR",status:"approved",type:"direct"},
{id:"p6",name:"Bananas",category:"Fruits",price:70,mrp:90,stock:35,icon:"🍌",seller:"JANA BAZAR",status:"approved",type:"direct"},
{id:"p7",name:"Cotton T-Shirt",category:"Fashion",price:399,mrp:499,stock:20,icon:"👕",seller:"JANA BAZAR",status:"approved",type:"direct"},
{id:"p8",name:"Smart Phone",category:"Electronics",price:8999,mrp:9999,stock:10,icon:"📱",seller:"JANA BAZAR",status:"approved",type:"direct"},
{id:"p9",name:"Kitchen Set",category:"Home",price:799,mrp:999,stock:15,icon:"🍳",seller:"JANA BAZAR",status:"approved",type:"direct"},
{id:"p10",name:"Potatoes",category:"Vegetables",price:45,mrp:60,stock:60,icon:"🥔",seller:"JANA BAZAR",status:"approved",type:"direct"},
{id:"p11",name:"Shampoo",category:"Personal Care",price:249,mrp:299,stock:18,icon:"🧴",seller:"JANA BAZAR",status:"approved",type:"direct"},
{id:"p12",name:"LED Bulb",category:"Home",price:129,mrp:169,stock:25,icon:"💡",seller:"JANA BAZAR",status:"approved",type:"direct"}
];

let products=load(KEYS.products,seedProducts);
let cart=load(KEYS.cart,[]);
let users=load(KEYS.users,[]);
let sellers=load(KEYS.sellers,[]);
let orders=load(KEYS.orders,[]);
let currentUser=load(KEYS.user,null);
let currentSeller=load(KEYS.seller,null);

let selectedCategory="All";
let searchText="";
let editingProductId=null;

function load(key,fallback){
try{
const x=localStorage.getItem(key);
return x?JSON.parse(x):JSON.parse(JSON.stringify(fallback));
}catch(e){return fallback}
}

function save(){
localStorage.setItem(KEYS.products,JSON.stringify(products));
localStorage.setItem(KEYS.cart,JSON.stringify(cart));
localStorage.setItem(KEYS.users,JSON.stringify(users));
localStorage.setItem(KEYS.sellers,JSON.stringify(sellers));
localStorage.setItem(KEYS.orders,JSON.stringify(orders));
if(currentUser)localStorage.setItem(KEYS.user,JSON.stringify(currentUser));
else localStorage.removeItem(KEYS.user);
if(currentSeller)localStorage.setItem(KEYS.seller,JSON.stringify(currentSeller));
else localStorage.removeItem(KEYS.seller);
}

function money(n){
return "₹"+Number(n||0).toLocaleString("en-IN");
}

function esc(s){
return String(s??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function showModal(id){
document.getElementById(id).classList.add("show");
}

function closeModal(id){
document.getElementById(id).classList.remove("show");
}

function categoriesRender(){
const cats=[
"All","Groceries","Fruits","Vegetables",
"Personal Care","Fashion","Electronics","Home"
];

document.getElementById("categories").innerHTML=cats.map(c=>`
<button class="cat ${selectedCategory===c?"active":""}"
onclick="setCategory('${c}')">${c}</button>
`).join("");
}

function setCategory(c){
selectedCategory=c;
categoriesRender();
renderProducts();
}

function renderProducts(){
const q=searchText.toLowerCase();

const list=products.filter(p=>{
const categoryOK=selectedCategory==="All"||p.category===selectedCategory;
const searchOK=
!q||
p.name.toLowerCase().includes(q)||
p.category.toLowerCase().includes(q)||
p.seller.toLowerCase().includes(q);

return categoryOK&&searchOK&&p.status==="approved"&&Number(p.stock)>0;
});

document.getElementById("productCount").textContent=list.length+" products";

if(!list.length){
document.getElementById("products").innerHTML=
`<div class="empty">No products found.</div>`;
return;
}

document.getElementById("products").innerHTML=list.map(p=>`
<div class="card">
<div class="product-img">${p.icon||"📦"}</div>
<div class="product-body">
<div class="product-name">${esc(p.name)}</div>
<div class="seller">🏪 ${esc(p.seller)}</div>
<div>
<span class="price">${money(p.price)}</span>
<span class="mrp">${money(p.mrp)}</span>
</div>
<div class="stock">✓ ${p.stock} available</div>
<div class="card-actions">
<button class="btn small" onclick="addToCart('${p.id}')">🛒 Add</button>
<button class="btn small secondary" onclick="buyNow('${p.id}')">Buy</button>
</div>
</div>
</div>
`).join("");
}

function addToCart(id){
const p=products.find(x=>x.id===id);
if(!p)return;

const item=cart.find(x=>x.id===id);

if(item)item.qty++;
else cart.push({id:id,qty:1});

save();
updateCartCount();
alert(p.name+" added to cart.");
}

function buyNow(id){
cart=[];
addToCart(id);
openCart();
}

function updateCartCount(){
const count=cart.reduce((a,b)=>a+Number(b.qty),0);
document.getElementById("cartCount").textContent=count;
}

function cartTotal(){
return cart.reduce((total,item)=>{
const p=products.find(x=>x.id===item.id);
return total+(p?p.price*item.qty:0);
},0);
}

function openCart(){
renderCart();
showModal("cartModal");
}

function renderCart(){
const box=document.getElementById("cartContent");

if(!cart.length){
box.innerHTML=`<div class="empty">🛒 Your cart is empty.</div>`;
return;
}

box.innerHTML=cart.map(item=>{
const p=products.find(x=>x.id===item.id);
if(!p)return "";

return `
<div class="cart-row">
<div class="cart-icon">${p.icon||"📦"}</div>
<div class="cart-info">
<b>${esc(p.name)}</b>
<div class="seller">${esc(p.seller)}</div>
<div>${money(p.price)} × ${item.qty}</div>
</div>
<div class="qty">
<button onclick="changeQty('${p.id}',-1)">−</button>
<b>${item.qty}</b>
<button onclick="changeQty('${p.id}',1)">+</button>
</div>
<button class="btn red small" onclick="removeCart('${p.id}')">×</button>
</div>
`;
}).join("")+`

<div class="total-box">
<h3>Total: ${money(cartTotal())}</h3>
<div class="form-actions">
<button class="btn" onclick="checkout()">Proceed to Checkout</button>
<button class="btn gray" onclick="cart=[];save();renderCart();updateCartCount()">Clear Cart</button>
</div>
</div>
`;
}

function changeQty(id,n){
const item=cart.find(x=>x.id===id);
if(!item)return;
item.qty+=n;
if(item.qty<=0)cart=cart.filter(x=>x.id!==id);
save();
updateCartCount();
renderCart();
}

function removeCart(id){
cart=cart.filter(x=>x.id!==id);
save();
updateCartCount();
renderCart();
}

function checkout(){
if(!cart.length)return;

if(!currentUser){
closeModal("cartModal");
openCustomer("login");
return;
}

const items=cart.map(item=>{
const p=products.find(x=>x.id===item.id);
return {
productId:p.id,
name:p.name,
price:p.price,
qty:item.qty,
seller:p.seller
};
});

const total=items.reduce((a,x)=>a+x.price*x.qty,0);

document.getElementById("cartContent").innerHTML=`
<h3>Checkout</h3>

<div class="notice">
Payment option: <b>Cash on Delivery</b>
</div>

<div class="field">
<label>Customer Name</label>
<input id="checkoutName" value="${esc(currentUser.name)}">
</div>

<div class="field">
<label>Mobile Number</label>
<input id="checkoutMobile" value="${esc(currentUser.mobile)}">
</div>

<div class="field">
<label>Delivery Address</label>
<textarea id="checkoutAddress" placeholder="Enter complete address"></textarea>
</div>

<div class="total-box">
<h3>Order Total: ${money(total)}</h3>
<button class="btn" onclick="placeOrder()">Place COD Order</button>
</div>
`;
}

function placeOrder(){
const name=document.getElementById("checkoutName").value.trim();
const mobile=document.getElementById("checkoutMobile").value.trim();
const address=document.getElementById("checkoutAddress").value.trim();

if(!name||!mobile||!address){
alert("Please fill all delivery details.");
return;
}

const items=cart.map(item=>{
const p=products.find(x=>x.id===item.id);
return {
productId:p.id,
name:p.name,
price:p.price,
qty:item.qty,
seller:p.seller
};
});

items.forEach(item=>{
const p=products.find(x=>x.id===item.productId);
if(p)p.stock=Math.max(0,p.stock-item.qty);
});

const order={
id:"JB"+Date.now(),
customer:currentUser.name,
mobile:mobile,
address:address,
items:items,
total:items.reduce((a,x)=>a+x.price*x.qty,0),
payment:"COD",
status:"Placed",
date:new Date().toLocaleString("en-IN")
};

orders.unshift(order);
cart=[];
save();
updateCartCount();

document.getElementById("cartContent").innerHTML=`
<div class="empty">
<h2>🎉 Order Placed!</h2>
<p style="margin:10px">Thank you for shopping with JANA BAZAR.</p>
<p><b>Order ID:</b> ${order.id}</p>
<p><b>Total:</b> ${money(order.total)}</p>
<p><b>Payment:</b> Cash on Delivery</p>
<div class="form-actions" style="justify-content:center">
<button class="btn" onclick="closeModal('cartModal')">Continue Shopping</button>
</div>
</div>
`;

renderProducts();
}


/* =========================
   CUSTOMER
   ========================= */

function openCustomer(mode="auto"){
renderCustomer(mode);
showModal("customerModal");
}

function renderCustomer(mode="auto"){
const box=document.getElementById("customerContent");

if(currentUser){
const myOrders=orders.filter(o=>o.mobile===currentUser.mobile);

box.innerHTML=`
<div class="panel">
<h3>Welcome, ${esc(currentUser.name)} 👋</h3>
<p>${esc(currentUser.mobile)}</p>
</div>

<div class="tabs">
<button class="tab active" onclick="renderCustomer('account')">Account</button>
<button class="tab" onclick="renderCustomer('orders')">Orders (${myOrders.length})</button>
</div>

${mode==="orders"?`
<div class="panel">
<h3>📋 My Orders</h3>
${myOrders.length?myOrders.map(o=>`
<div style="padding:12px 0;border-bottom:1px solid #eee">
<b>${o.id}</b>
<span class="badge approved">${o.status}</span>
<div>${o.date}</div>
<div>Total: <b>${money(o.total)}</b></div>
</div>
`).join(""):"<p>No orders yet.</p>"}
</div>
`:
`
<div class="panel">
<p>Customer account is active.</p>
<div class="form-actions">
<button class="btn" onclick="renderCustomer('orders')">📋 My Orders</button>
<button class="btn red" onclick="logoutCustomer()">Logout</button>
</div>
</div>
`}
`;
return;
}

box.innerHTML=`
<div class="tabs">
<button id="loginTab" class="tab active" onclick="renderLogin()">Login</button>
<button id="registerTab" class="tab" onclick="renderRegister()">Register</button>
</div>
<div id="customerForm"></div>
`;

if(mode==="register")renderRegister();
else renderLogin();
}

function renderLogin(){
document.getElementById("customerForm").innerHTML=`
<div class="field">
<label>Mobile Number</label>
<input id="loginMobile" type="tel" placeholder="10 digit mobile">
</div>
<div class="field">
<label>Password</label>
<input id="loginPassword" type="password" placeholder="Password">
</div>
<button class="btn" onclick="loginCustomer()">Login</button>
`;
}

function renderRegister(){
document.getElementById("customerForm").innerHTML=`
<div class="form-grid">
<div class="field">
<label>Name</label>
<input id="regName" placeholder="Full name">
</div>
<div class="field">
<label>Mobile</label>
<input id="regMobile" type="tel" placeholder="Mobile">
</div>
<div class="field full">
<label>Email</label>
<input id="regEmail" type="email" placeholder="Em
