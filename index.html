<body>

<

<script src="config.js"></script>

<script>
window.addEventListener('error', function(e) {
  const msg = e.error?.stack || [
    e.message || 'Unknown error',
    e.filename ? 'File: ' + e.filename : '',
    e.lineno ? 'Line: ' + e.lineno : '',
    e.colno ? 'Column: ' + e.colno : ''
  ].filter(Boolean).join('\n');

  document.body.innerHTML =
    '<div style="padding:24px;font:14px monospace;white-space:pre-wrap;color:#b00020;background:#fff">' +
    '<h2>JANA BAZAR BOOT ERROR</h2>' +
    msg +
    '</div>';
});

window.addEventListener('unhandledrejection', function(e) {
  document.body.innerHTML =
    '<div style="padding:24px;font:14px monospace;white-space:pre-wrap;color:#b00020;background:#fff">' +
    '<h2>JANA BAZAR PROMISE ERROR</h2>' +
    String(e.reason?.stack || e.reason || 'Unknown rejection') +
    '</div>';
});
</script>

<script src="app.js"></script>

</body>
</html>
